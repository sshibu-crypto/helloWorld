
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}My Flask Application{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

<style>
    body {
        background-color: #f4f6f9;
        color: #263238;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 850px;
        background-color: white;
        padding: 40px;
        margin-top: 60px !important;
        margin-bottom: 60px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }


h1 {
    color: #17365d;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 24px;
}

h2 {
    color: #245b83;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
}

    .form-label {
        font-weight: 600;
    }

    .form-control,
    .form-select {
        padding: 12px;
        border-radius: 6px;
    }

    .btn-primary {
        background-color: #17365d;
        border-color: #17365d;
        padding: 10px 22px;
    }

    .btn-primary:hover {
        background-color: #245b83;
        border-color: #245b83;
    }

    a {
        color: #245b83;
    }
</style>

</head>
<body>
     <div class="container mt-5">
        {% block page_content %}{% endblock %}

        <footer class="mt-5 pt-3 border-top text-muted">
            <p>Created by Sara Shibu</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
